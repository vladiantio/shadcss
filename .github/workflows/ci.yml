name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter shadcss check
      - run: pnpm docs:css
      - run: pnpm registry:examples
      - run: git diff --exit-code web/src/styles/shadcss.css packages/shadcss/registry
      - run: pnpm --filter web check
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter web exec playwright test
