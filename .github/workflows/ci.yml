name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.18.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter loseta test
      - run: pnpm --filter loseta check
      - run: pnpm docs:css
      - run: pnpm registry:examples
      - run: git diff --exit-code web/src/styles/loseta.css web/public/styles packages/loseta/registry
      - run: pnpm --filter web check
      - run: pnpm --filter web build
      - run: pnpm --filter web exec playwright install --with-deps chromium webkit
      - run: pnpm --filter web exec playwright test
